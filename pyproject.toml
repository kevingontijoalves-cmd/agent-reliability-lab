[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-reliability-lab"
version = "0.1.0"
description = "MCP server for versioned prompts, deterministic evaluation, provider fallback, and run telemetry."
requires-python = ">=3.11"
dependencies = [
  "mcp>=2,<3",
  "openai>=1,<3",
  "anthropic>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[project.scripts]
agent-reliability-lab = "reliability_lab.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reliability_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
